<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Neural Simulator browser benchmark</title>
<!-- Same onnxruntime-web version as the deployed demo (drift-sim). -->
<script src="https://cdn.jsdelivr.net/npm/onnxruntime-web@1.22.0/dist/ort.all.min.js"></script>
</head>
<body>
<pre id="log">running…</pre>
<script>
// Closed-loop benchmark: every step feeds the model's own outputs back in, as the demo does.
// Query: ?ep=wasm|webgpu&threads=N&steps=N
const params = new URLSearchParams(location.search);
const EP = params.get('ep') || 'wasm';
const THREADS = Number(params.get('threads') || 1);
const STEPS = Number(params.get('steps') || 300);
const WARMUP = 20;
const A = '../../artifacts/';
const log = (s) => (document.getElementById('log').textContent += '\n' + s);

function rand(n) { const a = new Float32Array(n); for (let i = 0; i < n; i++) a[i] = Math.random(); return a; }
const T = (data, dims) => new ort.Tensor('float32', data, dims);
function stats(ms) {
  const s = [...ms].sort((a, b) => a - b);
  const q = (p) => s[Math.min(s.length - 1, Math.floor(p * s.length))];
  return { median_ms: +q(0.5).toFixed(3), p90_ms: +q(0.9).toFixed(3), mean_ms: +(s.reduce((a, b) => a + b, 0) / s.length).toFixed(3), steps: s.length };
}
async function session(path) {
  return ort.InferenceSession.create(A + path, { executionProviders: [EP], graphOptimizationLevel: 'all' });
}

async function carla() {
  const enc = await session('carla/lidar_encoder.onnx');
  const sim = await session('carla/world_transition.onnx');
  const latent = (await enc.run({ lidar: T(rand(64 * 64), [1, 64, 64, 1]) })).lidar_latent;
  let state = { vision: T(rand(96 * 96 * 3), [1, 96, 96, 3]), lidar_latent: latent, telemetry: T(rand(5), [1, 5]), waypoints: T(rand(75), [1, 25, 3]) };
  const times = [];
  for (let k = 0; k < WARMUP + STEPS; k++) {
    const t = performance.now();
    const out = await sim.run({ ...state, controls: T(new Float32Array([0.5, 0, 0]), [1, 3]) });
    state = { vision: out.next_vision, lidar_latent: out.next_lidar_latent, telemetry: out.next_telemetry, waypoints: out.next_waypoints };
    if (k >= WARMUP) times.push(performance.now() - t);
  }
  return stats(times);
}

async function tinyskies() {
  const enc = await session('tinyskies/encoder.onnx');
  const sim = await session('tinyskies/latent_sim.onnx');
  const dec = await session('tinyskies/decoder.onnx');
  const z0 = (await enc.run({ rgb: T(rand(96 * 96 * 3), [1, 96, 96, 3]) })).z_mean.data;
  const L = 6 * 6 * 64;
  let hist = new Float32Array(4 * L); for (let i = 0; i < 4; i++) hist.set(z0, i * L);
  let ctrl = new Float32Array(12);
  const times = [];
  for (let k = 0; k < WARMUP + STEPS; k++) {
    const t = performance.now();
    const c = new Float32Array([1, 0, 0]);
    const out = await sim.run({ latent_history: T(hist, [1, 4, 6, 6, 64]), control_history: T(ctrl, [1, 4, 3]), controls: T(c, [1, 3]) });
    const z = out.next_latent.data;
    await dec.run({ z: T(z, [1, 6, 6, 64]) });
    const h = new Float32Array(4 * L); h.set(hist.subarray(L)); h.set(z, 3 * L); hist = h;
    const cc = new Float32Array(12); cc.set(ctrl.subarray(3)); cc.set(c, 9); ctrl = cc;
    if (k >= WARMUP) times.push(performance.now() - t);
  }
  return stats(times);
}

(async () => {
  const result = { ep: EP, threads: THREADS, crossOriginIsolated: self.crossOriginIsolated, userAgent: navigator.userAgent, ort: ort.env.versions };
  try {
    ort.env.wasm.numThreads = THREADS;
    result.carla_step = await carla();
    result.tinyskies_step = await tinyskies();
  } catch (e) {
    result.error = String(e);
  }
  window.__results = result;
  log(JSON.stringify(result, null, 2));
})();
</script>
</body>
</html>
